const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key='pl-workdesk-v1';const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'});const uid=()=>crypto.randomUUID?crypto.randomUUID():'t'+Date.now().toString(36)+Math.random().toString(36).slice(2);const T={Monitoring:['Visit 진행 및 일정 확인','CRA Draft 수령','Protocol/SOP 기준 검토','MVR Finding / Action item 확인','MVR·FUL 일관성 확인','CRA 수정 요청 및 반영 확인','MVR/FUL 승인','기관 발송 여부 확인','Open issue 및 eTMF filing 확인'],Report:['Reporting timeline 수립','DM/PV/STAT/MW 일정 연계','보고 기간·기관·대상자 정보 확인','분석군 대상자 수 및 제외사유 확인','MW Draft 수령','PL Review 및 운영정보 일관성 확인','NIS Report Checklist 작성·서명','Sponsor Review','Comment resolution 확인','Final version 확인','제출 및 문서보관 확인'],'DM / PV':['업무요건 및 위임범위 확인','DM/EDC 변경사항 검토','Safety 정보 전달 및 Follow-up 확인','Sponsor 확인 및 승인','변경사항 문서화'],Finance:['PTC 내역 확인','Add-work 발생 및 계약 scope 확인','금액 및 산출근거 검토','Sponsor 비용 협의','세금계산서 발행 및 청구 확인'],LTFU:['최신 환자정보양식 확인','DM/PV/RA 위임범위 확인','부서별 Timeline 협의','Add-work 확인 및 Sponsor 비용 협의','DM 작성 완료 확인','필요 시 PV 작성 완료 확인','PL 작성 단계 확인','환자 ID/이름은 승인된 별도 파일에서 입력','별도 파일 암호화 및 전송방법 확인','RA/Sponsor 전달 확인','암호 별도 전달 확인','제출 완료 확인'],Site:['기관 정보 및 CRA 배정 확인','Contract/CDA 확인','SIV 준비 및 Essential document 확인','SIV 진행','MVR/FUL 승인 및 기관 발송 확인','eTMF filing 및 Activation 확인'],Communication:['요청 및 담당자 확인','내부 부서 의견 취합','Sponsor 회신','Outstanding item 후속 확인'],'Daily':['Sponsor 신규 요청 확인','CRA 문의 및 Issue 확인','MVR/FUL Review 요청 확인','SAE/AE 및 PV Follow-up 필요 여부 확인','DM/EDC Issue 확인','오늘·익일 Deadline 확인','Sponsor 회신 처리'],'Weekly':['Milestone/Timeline 업데이트','CRA별 Site progress 확인','Open issue 및 Overdue 추적','DM/PV/MW/STAT/RA 산출물 확인','Sponsor Outstanding item 확인','Add-work 및 Scope change 확인','eTMF 누락 여부 확인']};
let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}if(!state||!Array.isArray(state.projects)||!Array.isArray(state.tasks)){state={projects:[{id:'p1',name:'PMS 프로젝트 A',code:'PMS-001',type:'PMS',sponsor:'공동 PMS'},{id:'p2',name:'PMS 프로젝트 B',code:'PMS-002',type:'PMS',sponsor:'프로젝트 예시'},{id:'p3',name:'PMS 프로젝트 C',code:'PMS-003',type:'PMS',sponsor:'Sponsor'},{id:'p4',name:'장기추적조사',code:'LTFU',type:'장기추적조사',sponsor:'프로젝트 예시'}],tasks:[]};let demo=[['p1','기관 A SIVR · FUL 검토','Monitoring','2026-10-28','진행 중','CRA',2],['p2','정기보고서 PL Review 및 Checklist 서명','Report','','미시작','MW',0],['p3','Final Appendix 검토 의견 확인','Report','','회신 대기','Sponsor',3],['p1','3Q PTC 및 Add-work 내역 확인','Finance','','미시작','경영관리',0],['p4','환자정보양식 V3.0 준비 및 전달 확인','LTFU','','진행 중','DM',2],['','일일 PL 업무 점검','Daily','','미시작','PL',0]];state.tasks=demo.map(([project,title,category,due,status,waiting,n])=>({id:uid(),project,title,category,due,status,waiting,owner:'PL',priority:'보통',memo:'첨부 자료를 바탕으로 구성한 예시 업무입니다. 실제 상태와 마감일을 확인해 수정하세요.',link:'',demo:true,checks:T[category].map((text,i)=>({text,done:i<n,na:false}))}));save()}
let view='대시보드',filter='전체',search='',projectFilter='';const done=t=>t.status==='완료',active=t=>!done(t)&&t.status!=='N/A',isOver=t=>active(t)&&t.due&&t.due<today(),pct=t=>{let c=t.checks.filter(x=>!x.na);return c.length?Math.round(c.filter(x=>x.done).length/c.length*100):0};function save(){localStorage.setItem(key,JSON.stringify(state))}function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2500)}function closeModal(){$('#overlay').innerHTML=''}function modal(title,body){$('#overlay').innerHTML=`<div class="modalback"><section role="dialog" aria-modal="true" aria-label="${esc(title)}" class="modal"><div class="modalhead"><h2>${esc(title)}</h2><button class="close" onclick="closeModal()" aria-label="닫기">×</button></div>${body}</section></div>`;$('#overlay input')?.focus()}

function parseMail(text, projects, baseDate) {
  const lines=text.replace(/\r/g,'').split('\n').map(s=>s.trim()).filter(Boolean);
  const subject=lines.find(s=>/^(?:제목|subject)\s*[:：]/i.test(s));
  const headers=/^(?:보낸\s*사람|받는\s*사람|참조|보낸\s*날짜|보낸\s*시간|보냄|날짜|from|to|cc|sent|date|subject|제목)\s*[:：]/i;
  const body=lines.filter(s=>!headers.test(s));
  const request=body.find(s=>/(?:검토|확인|회신|작성|제출|승인|review|confirm|submit|approve|provide|send).*(?:부탁|요청|바랍|please)|please.*(?:review|confirm|submit|approve|provide|send)/i.test(s));
  let title=(subject?subject.replace(/^(?:제목|subject)\s*[:：]\s*/i,''):request||body.find(s=>s.length>6)||'메일 후속 업무').replace(/^(?:(?:re|fw|fwd)\s*:\s*)+/i,'').slice(0,200);
  const senderLine=lines.find(s=>/^(?:보낸\s*사람|from)\s*[:：]/i.test(s));
  const requester=senderLine?senderLine.replace(/^[^:：]+[:：]\s*/,'').slice(0,150):'';
  // Do not derive a deadline from a Sent/Date header or from quoted old threads.
  let current=[];for(const line of body){if(/^-{2,}\s*(?:Original Message|원본 메시지)|^On .+wrote:|^_{5,}/i.test(line))break;current.push(line)}
  const dueLines=current.filter(s=>/(?:due|deadline|마감|기한|까지|\bby\b)/i.test(s));
  const dates=[];
  const valid=(y,m,d)=>{const dt=new Date(Date.UTC(y,m-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d?`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`:''};
  const shift=n=>{const dt=new Date(baseDate+'T12:00:00Z');dt.setUTCDate(dt.getUTCDate()+n);return dt.toISOString().slice(0,10)};
  for(const line of dueLines){
    let found=false;
    for(const m of line.matchAll(/(?:(20\d{2})\s*(?:[-/.]|년)\s*)?(\d{1,2})\s*(?:[-/.]|월)\s*(\d{1,2})(?:\s*일)?(?!\d)/g)){
      const value=valid(Number(m[1]||baseDate.slice(0,4)),Number(m[2]),Number(m[3]));if(value){dates.push({value,line,assumedYear:!m[1]});found=true}
    }
    const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    for(const m of line.matchAll(/\b(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(20\d{2}))?\b/gi)){
      const value=valid(Number(m[3]||baseDate.slice(0,4)),months[m[1].slice(0,3).toLowerCase()],Number(m[2]));if(value){dates.push({value,line,assumedYear:!m[3]});found=true}
    }
    if(!found){let n=/모레/.test(line)?2:/내일|\btomorrow\b/i.test(line)?1:/오늘|금일|\btoday\b/i.test(line)?0:null;if(n!==null)dates.push({value:shift(n),line,relative:true})}
  }
  const unique=[...new Set(dates.map(d=>d.value))];
  const content=(subject||'')+'\n'+current.join('\n');
  const scored=projects.map(p=>{let score=0;for(const value of [p.code,p.name]){if(value&&value.length>=3&&content.toLowerCase().includes(value.toLowerCase()))score+=value===p.code?3:2}return {p,score}}).filter(x=>x.score).sort((a,b)=>b.score-a.score);
  const project=scored.length===1?scored[0].p.id:'';
  const categories=[['Monitoring',/\b(?:MVR|SIVR|COVR|FUL|SIV|monitoring)\b|모니터링/i],['Report',/\b(?:CSR|report|appendix|STAT|MW)\b|보고서|정기보고|별첨/i],['Finance',/\b(?:PTC|invoice|add[- ]?work|cost|budget)\b|청구|비용|세금계산서|예산/i],['LTFU',/환자정보양식|\bLTFU\b|장기추적/i],['DM / PV',/\b(?:DM|PV|EDC|SAE|AE|query)\b|데이터|이상사례|쿼리/i],['Site',/\b(?:CDA|contract|activation)\b|기관개시|기관 개시|계약서/i],['Communication',/\b(?:KOM|PJM|PLM|meeting)\b|회의|회신/i]];
  const category=(categories.find(([c,re])=>re.test(title))||categories.find(([c,re])=>re.test(content))||['Communication'])[0];
  const warnings=[];
  if(!unique.length)warnings.push('마감일을 확정하지 못했어요. 날짜를 직접 지정하세요.');
  if(unique.length>1)warnings.push('마감 관련 날짜가 여러 개여서 자동 선택하지 않았어요. 원문을 보고 지정하세요.');
  if(dates.some(d=>d.assumedYear))warnings.push('연도가 없는 날짜는 현재 연도를 적용했어요. 연도를 확인하세요.');
  if(dates.some(d=>d.relative))warnings.push('오늘·내일 등의 날짜는 메일 발송일이 아닌 붙여넣은 오늘 기준이에요. 확인하세요.');
  if(unique.length===1&&unique[0]<baseDate)warnings.push('추출한 마감일이 오늘보다 이전이에요. 연도와 날짜를 확인하세요.');
  if(!project)warnings.push(scored.length>1?'여러 프로젝트가 언급되어 있어요. 프로젝트를 직접 선택하세요.':'일치하는 프로젝트를 찾지 못했어요. 프로젝트를 직접 선택하세요.');
  return {title,project,category,due:unique.length===1?unique[0]:'',requester,priority:/긴급|우선|urgent|ASAP/i.test(title)?'높음':'보통',status:'미시작',owner:'PL',waiting:'',link:'',memo:requester?'메일 요청자: '+requester:'',warnings,evidence:dueLines.slice(0,5)};
}
function pasteMail(){modal('메일에서 업무 만들기',`<form id="mailform"><p style="margin-top:0;font-size:13px">메일 제목과 본문을 붙여넣으세요. 한 번에 한 업무 초안을 만들며, 등록 전에 수정할 수 있어요.</p><label class="field full">메일 내용<textarea id="mailtext" required style="min-height:240px" placeholder="제목: [PMS-001] 기관 A SIVR 및 FUL 검토 요청\n보낸 사람: 담당 CRA\n\n10월 28일까지 SIVR 및 FUL 검토 부탁드립니다."></textarea></label><div class="template">브라우저 내 키워드·날짜 규칙으로 추출합니다. 외부 AI 전송 없이 처리하며, 붙여넣은 메일 원문은 저장하지 않습니다.<br>업무명·요청자 등 추출한 정보는 등록 시 업무에 저장됩니다.</div><div class="modalfoot"><button type="button" class="secondary" onclick="closeModal()">취소</button><button class="primary">업무 초안 확인 →</button></div></form>`);$('#mailform').onsubmit=e=>{e.preventDefault();const text=$('#mailtext').value.trim();if(!text)return;const draft=parseMail(text,state.projects,today());newTask(null,draft);const form=$('#taskform');const box=document.createElement('div');box.className='template';box.innerHTML='<strong>메일에서 추출한 초안 · 등록 전 확인</strong><br>'+draft.warnings.map(w=>'• '+esc(w)).join('<br>')+(draft.evidence.length?'<details style="margin-top:10px"><summary>날짜 판단에 사용한 문장</summary><div style="white-space:pre-wrap;margin-top:8px">'+draft.evidence.map(esc).join('\n')+'</div></details>':'')+'<div style="margin-top:8px">여러 요청이 포함된 메일은 업무를 나누어 등록하세요. 자동 추출 결과는 확정된 업무 지시가 아닙니다.</div>';form.prepend(box)}}

</script></body></html>
